<!doctype html>
<html lang="en" dir="ltr" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mohammed Maher — Expert Graphic Designer</title>
    <meta name="description" content="Luxury single-page graphic designer portfolio featuring cinematic art direction, interactive Selected Work carousel, bilingual English & Arabic support, and full-detail project modal." />
    <!-- Anti-flash inline theme script -->
    <script>
      (function() {
        try {
          const saved = localStorage.getItem('portfolio-theme');
          let theme = saved;
          if (!theme || (theme !== 'dark' && theme !== 'light')) {
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
            if (prefersDark) {
              theme = 'dark';
            } else if (prefersLight) {
              theme = 'light';
            } else {
              theme = 'dark';
            }
          }
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch (e) {}
      })();
    </script>
    <!--ssr-head-tags-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Cinzel:wght@500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#09070c] text-neutral-100 antialiased selection:bg-rose-500/30 selection:text-rose-200 overflow-x-hidden min-h-screen">
    <div id="root"><!--ssr-outlet--></div>
    <script type="module" src="/src/entry-client.jsx"></script>
  </body>
</html>
