services:
  # ────────────────────────────────────────────────────────────────
  # Web Service: Laravel API Backend
  # ────────────────────────────────────────────────────────────────
  - type: web
    name: portfolio-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: starter
    region: frankfurt
    autoDeploy: false
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_NAME
        value: "Graphic Designer Portfolio API"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://portfolio-api.onrender.com
      - key: LOG_CHANNEL
        value: daily
      - key: DB_CONNECTION
        value: mysql
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString
      - key: SANCTUM_STATEFUL_DOMAINS
        value: "portfolio.vercel.app,localhost:3000,localhost:5173"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://portfolio.vercel.app,http://localhost:3000"
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "120"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_SAME_SITE
        value: lax
      - key: FILESYSTEM_DISK
        value: local
      # Cloudinary credentials (configured in Render Dashboard or .env)
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # ────────────────────────────────────────────────────────────────
  # Cron Job: Daily Encrypted Database Backup with 7-Day Retention
  # ────────────────────────────────────────────────────────────────
  - type: cron
    name: portfolio-daily-backup
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: starter
    region: frankfurt
    schedule: "0 2 * * *" # Daily at 02:00 UTC
    command: php artisan backup:run --retention=7
    envVars:
      - key: APP_ENV
        value: production
      - key: DB_CONNECTION
        value: mysql
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString
      - key: APP_KEY
        fromService:
          type: web
          name: portfolio-api
          envVarKey: APP_KEY

databases:
  # ────────────────────────────────────────────────────────────────
  # Managed MySQL Database
  # ────────────────────────────────────────────────────────────────
  - name: portfolio-db
    databaseName: portfolio_prod
    user: portfolio_user
    plan: starter
    region: frankfurt
