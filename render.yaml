services:
  # ────────────────────────────────────────────────────────────────
  # Web Service: Laravel API Backend (Strictly $0/month Free Tier)
  # ────────────────────────────────────────────────────────────────
  - type: web
    name: mohammed-portfolio-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: frankfurt
    autoDeploy: false
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_NAME
        value: "Graphic Designer Portfolio API"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://mohammed-portfolio-api.onrender.com
      - key: LOG_CHANNEL
        value: daily
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: mysql-1244d130-hosam-cbf4.f.aivencloud.com
      - key: DB_PORT
        value: "18272"
      - key: DB_DATABASE
        value: defaultdb
      - key: DB_USERNAME
        value: portfolio_user
      - key: DB_PASSWORD
        sync: false
      - key: MYSQL_ATTR_SSL_VERIFY_SERVER_CERT
        value: "false"
      - key: SANCTUM_STATEFUL_DOMAINS
        value: "mohammed-design.vercel.app,mohammed-portfolio.vercel.app,localhost:3000,localhost:5173"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://mohammed-design.vercel.app,https://mohammed-portfolio.vercel.app,http://localhost:3000"
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "120"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_SAME_SITE
        value: lax
      - key: FILESYSTEM_DISK
        value: public
      # Cloudinary credentials (optional runtime media fallback)
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
